CONFIG_PRINTK=y
CONFIG_IPM=y
CONFIG_TIMESLICE_SIZE=1
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_OPENAMP=y
CONFIG_OPENAMP_SLAVE=n
CONFIG_SHELL=y
CONFIG_UART_SHELL=y

# Motion CONTROL Platform Configuration
CONFIG_MOTION_CONTROL=y
CONFIG_MOTION_CONTROL_SERVICES=y
CONFIG_MOTION_CONTROL_SERVICES_REGISTER=y
CONFIG_MOTION_CONTROL_EVENT_HANDLER=y
CONFIG_CONTROL_LOOP=y
CONFIG_PLANT=y
CONFIG_PLANT_MODEL_DC_MOTOR=y
CONFIG_STATE_SPACE_MODEL=y
CONFIG_FPU=y

# Network configuration
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Network management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# MQTT configuration
CONFIG_MQTT_LIB=y
CONFIG_MQTT_PUB_SUB_CLIENT=y

CONFIG_LOG=y
CONFIG_MQTT_LOG_LEVEL_ERR=y
CONFIG_NET_LOG=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Memory
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Random number generator
CONFIG_TEST_RANDOM_GENERATOR=y

# System initialization
CONFIG_APPLICATION_INIT_PRIORITY=99

# Network interface
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=10
